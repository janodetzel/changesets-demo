# Explicit build dependencies for this small demo. Keep consumer paths in sync
# when adding a shared package or a new domain.
billing:
  - 'domains/billing/**'
  - 'packages/money/**'
payment:
  - 'domains/payment/**'
  - 'packages/money/**'
wingman:
  - 'domains/wingman/**'
shared:
  - 'package.json'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - '.npmrc'
  - '.nvmrc'
  - '.node-version'
  - 'nx.json'
  - 'scripts/release-notes.mjs'
  - '.github/domain-paths.yml'
  - '.github/workflows/release.yml'
  - '.github/workflows/domain-release.yml'
  - '.github/workflows/deploy-dev.yml'
  - '.github/workflows/domain-dev.yml'
  - '.github/workflows/domain-build.yml'
  - '.github/workflows/select-domains.yml'
