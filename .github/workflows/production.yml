name: Production

# Every push to main (the merged Version Packages PR or a hotfix):
# 1. a hotfix's changesets are versioned on main;
# 2. new versions are tagged and get a GitHub release;
# 3. those versions deploy to production once `production` is approved;
# 4. main is merged back into dev, without the changesets main has released.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  statuses: write
  actions: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.tag.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Version a hotfix's changesets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ls .changeset/*.md 2>/dev/null | grep -qv '/README.md$'; then
            pnpm exec changeset version
            git add -A
            git commit -m "Version Packages (hotfix)"
            git push origin HEAD:main
          else
            echo "No pending changesets on main."
          fi
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/tag-release.mjs

  deploy-production:
    needs: release
    if: ${{ needs.release.outputs.released != '' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the new versions
        env:
          RELEASED: ${{ needs.release.outputs.released }}
        run: node scripts/deploy.mjs production $RELEASED

  back-merge:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Merge main into dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/back-merge.mjs
          git push origin HEAD:dev
          # A push with the workflow token doesn't trigger dev.yml; rebuild the
          # Version Packages PR for the changesets still pending.
          gh workflow run release-pr.yml --ref dev
