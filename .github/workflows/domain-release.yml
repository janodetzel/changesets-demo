name: Release one domain
on:
  workflow_call:
    inputs:
      domain:
        type: string
        required: true
      package:
        description: Registry package sharing this domain's fixed version, if any
        type: string
        required: false
        default: ''
      package_path:
        type: string
        required: false
        default: ''
      hotfix:
        description: Released from a branch cut at a deployed commit, not from main
        type: boolean
        required: false
        default: false
permissions:
  contents: write
  actions: write
  deployments: read
  packages: write
concurrency:
  # A hotfix gets its own lane: it must not queue behind the pending candidate
  # whose contents are the reason the hotfix exists.
  group: release-${{ inputs.domain }}${{ inputs.hotfix && '-hotfix' || '' }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/domain-build.yml
    with:
      domain: ${{ inputs.domain }}
      release_candidate: true
  publish:
    name: Publish ${{ inputs.package }} ${{ needs.build.outputs.version }}
    needs: build
    if: inputs.package != ''
    uses: ./.github/workflows/package-publish.yml
    with:
      domain: ${{ inputs.domain }}
      package: ${{ inputs.package }}
      path: ${{ inputs.package_path }}
  stage:
    name: STAGE ${{ inputs.domain }} ${{ needs.build.outputs.version }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    environment: stage-${{ inputs.domain }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: artifact
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify and deploy to STAGE (simulated), then test
        working-directory: artifact
        env:
          DOMAIN: ${{ inputs.domain }}
        run: |
          sha256sum --check SHA256SUMS
          jq -e --arg domain "$DOMAIN" --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            '.domain == $domain and .sourceSha == $sha and .runId == $run' provenance.json
          node --test test/acceptance.test.mjs
      - name: Summarize the production candidate
        env:
          DOMAIN: ${{ inputs.domain }}
        run: |
          {
            VERSION=$(jq -r .version artifact/provenance.json)
            printf '## %s %s passed automated STAGE checks\n\nSource: `%s`\n\n' "$DOMAIN" "$VERSION" "$GITHUB_SHA"
            printf 'Finish manual STAGE testing, then approve **prod-%s** through **Review deployments**.\n\n' "$DOMAIN"
            cat artifact/RELEASE.md
            printf '\n### Exact artifact checksums\n\n```\n'
            cat artifact/SHA256SUMS
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
  production:
    name: PROD ${{ inputs.domain }} ${{ needs.build.outputs.version }}
    needs: [build, stage]
    runs-on: ubuntu-latest
    environment: prod-${{ inputs.domain }}
    permissions:
      contents: write
      actions: write
      deployments: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: artifact
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify source, reserved version, and production baseline
        env:
          GH_TOKEN: ${{ github.token }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          (cd artifact && sha256sum --check SHA256SUMS)
          VERSION=$(jq -r .version artifact/provenance.json)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-list -n 1 "$DOMAIN@v$VERSION")" = "$GITHUB_SHA"
          # Another prepared candidate of this domain must not replace STAGE
          # before an older candidate is approved; per-domain concurrency holds it.
          # Never reuse a stable version for different bytes/source.
          if gh release view "$DOMAIN@v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release download "$DOMAIN@v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP/existing"
            cmp artifact/SHA256SUMS "$RUNNER_TEMP/existing/SHA256SUMS"
          fi
          node scripts/release-summary.mjs "$DOMAIN" verify
      - name: Deploy unchanged artifact to PROD (simulated) and smoke test
        working-directory: artifact
        env:
          DOMAIN: ${{ inputs.domain }}
        run: |
          sha256sum --check SHA256SUMS
          jq -e --arg domain "$DOMAIN" --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            '.domain == $domain and .sourceSha == $sha and .runId == $run' provenance.json
          node --test test/acceptance.test.mjs
      - name: Create a domain release record
        env:
          GH_TOKEN: ${{ github.token }}
          DOMAIN: ${{ inputs.domain }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          VERSION=$(jq -r .version artifact/provenance.json)
          TAG="$DOMAIN@v$VERSION"
          {
            printf '# %s %s\n\n' "$DOMAIN" "$VERSION"
            cat artifact/RELEASE.md
            printf '\nSource: `%s`\n\n' "$GITHUB_SHA"
            printf 'Build, STAGE approval, and PROD approval: https://github.com/%s/actions/runs/%s\n\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Immutable Actions artifact ID: `%s`\n\n' "$ARTIFACT_ID"
            printf 'This release applies only to **%s**. Other domains retain their previous releases.\n' "$DOMAIN"
          } > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            printf 'Release %s already exists; preserving its original record.\n' "$TAG"
          else
            gh release create "$TAG" artifact/provenance.json artifact/SHA256SUMS artifact/CHANGELOG.md \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$DOMAIN $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" --latest=false
          fi
          printf '## Released %s\n\n[Domain release](https://github.com/%s/releases/tag/%s)\n' "$DOMAIN" "$GITHUB_REPOSITORY" "$TAG" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Refresh preparation after stable finalization
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run prepare-release.yml --repo "$GITHUB_REPOSITORY" --ref main
