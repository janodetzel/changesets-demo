name: PR checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm test
  changeset:
    # Existing repository rules require this name. Reuse it for release-note review.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify domain release descriptions exist
        run: |
          for domain in billing payment wingman; do
            test -s "domains/$domain/RELEASE.md"
          done
