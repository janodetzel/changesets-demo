name: PR checks

# Required by the rulesets: `changeset` on dev and main, `hold-back` on main.
# The Version Packages PR gets both as commit statuses from the release workflow
# (a PR the workflow opens doesn't trigger this one), so they're skipped here.

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]

jobs:
  changeset:
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Branch flow
        env:
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$BASE:$HEAD_REF" in
            dev:feature/*|main:hotfix/*) echo "$HEAD_REF → $BASE is allowed." ;;
            *) echo "::error::$HEAD_REF → $BASE isn't part of the flow: feature/* goes into dev, hotfix/* into main, and only the Version Packages PR goes from dev to main."; exit 1 ;;
          esac
      - name: The PR adds a changeset
        env:
          BASE: ${{ github.base_ref }}
        run: |
          added=$(git diff --name-only --diff-filter=A "origin/$BASE...HEAD" -- '.changeset/*.md' | grep -v '/README.md$' || true)
          if [ -z "$added" ]; then
            echo "::error::Add a changeset: run 'pnpm changeset' and pick the packages you changed, or 'pnpm changeset --empty' for docs, CI and other changes that release nothing."
            exit 1
          fi
          echo "Changesets in this PR:"; echo "$added"

  hold-back:
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Only the Version Packages PR holds changesets back; nothing to check here."

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm test
