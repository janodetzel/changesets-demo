name: PR checks

# Required by the ruleset on main. The Version Packages PR is opened by the
# changesets action with the workflow token, which triggers no workflows; the
# maintainer merges it (rulesets let admins bypass the required checks).

on:
  pull_request:
    branches: [main]

jobs:
  changeset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The PR adds a changeset (not needed for a PR that only flips flags)
        run: |
          changed=$(git diff --name-only origin/main...HEAD)
          if ! grep -qv '^flags/' <<<"$changed"; then
            echo "Only flags/ changed: no changeset needed."
            exit 0
          fi
          added=$(git diff --name-only --diff-filter=A origin/main...HEAD -- '.changeset/*.md' | grep -v '/README.md$' || true)
          if [ -z "$added" ]; then
            echo "::error::Add a changeset: run 'pnpm changeset' and pick the packages you changed, or 'pnpm changeset --empty' for docs, CI and other changes that release nothing."
            exit 1
          fi
          echo "Changesets in this PR:"; echo "$added"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm test
