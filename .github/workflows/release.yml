name: Release domains
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: write
  deployments: read
  packages: write
jobs:
  changes:
    name: Select versioned domains
    uses: ./.github/workflows/select-domains.yml
    with:
      flow: release
  billing:
    name: Billing
    needs: changes
    if: needs.changes.outputs.billing == 'true'
    uses: ./.github/workflows/domain-release.yml
    with:
      domain: billing
  payment:
    name: Payment Provider
    needs: changes
    if: needs.changes.outputs.payment == 'true'
    uses: ./.github/workflows/domain-release.yml
    with:
      domain: payment
  wingman:
    name: Wingman
    needs: changes
    if: needs.changes.outputs.wingman == 'true'
    uses: ./.github/workflows/domain-release.yml
    with:
      domain: wingman
  billing-api:
    name: Billing API package
    needs: changes
    if: needs.changes.outputs.billing_api == 'true'
    uses: ./.github/workflows/package-publish.yml
    with:
      package: billing-api
      path: domains/billing/packages/billing-api
