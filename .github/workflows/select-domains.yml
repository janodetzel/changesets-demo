name: Select domains
on:
  workflow_call:
    inputs:
      flow:
        type: string
        required: true
    outputs:
      billing:
        value: ${{ jobs.changes.outputs.billing }}
      payment:
        value: ${{ jobs.changes.outputs.payment }}
      wingman:
        value: ${{ jobs.changes.outputs.wingman }}
permissions:
  contents: read
jobs:
  changes:
    name: Select affected projects or prepared versions
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
    outputs:
      billing: ${{ steps.select.outputs.billing }}
      payment: ${{ steps.select.outputs.payment }}
      wingman: ${{ steps.select.outputs.wingman }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select using Nx affected and version changes
        id: select
        env:
          BASE_SHA: ${{ github.event.before }}
          FLOW: ${{ inputs.flow }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            printf '["billing","payment","wingman"]' > "$RUNNER_TEMP/affected.json"
            BASE_SHA=$(git rev-list --max-parents=0 HEAD)
          else
            pnpm exec nx show projects --affected --base="$BASE_SHA" --head="$GITHUB_SHA" --json > "$RUNNER_TEMP/affected.json"
          fi
          released_elsewhere() {
            # True when this version's tag already points at a different commit,
            # which means it was released from another ref and this push is a
            # hotfix back-merge. A tag on this very commit is this push's own
            # reservation, so a re-run must still proceed.
            TAG="$1@v$2"
            git rev-parse --verify --quiet "refs/tags/$TAG" > /dev/null \
              || git fetch origin "refs/tags/$TAG:refs/tags/$TAG" 2> /dev/null \
              || return 1
            [[ "$(git rev-list -n 1 "refs/tags/$TAG")" != "$GITHUB_SHA" ]]
          }
          preparation=false
          backmerged=''
          for domain in billing payment wingman; do
            before=$(git show "$BASE_SHA:domains/$domain/package.json" | jq -r .version)
            after=$(jq -r .version "domains/$domain/package.json")
            if [[ "$before" == "$after" ]]; then continue; fi
            # A back-merge carries the hotfix source and its version together.
            # That code already shipped, so the purity guard must not reject it
            # and the release flow must not reserve the tag a second time.
            if released_elsewhere "$domain" "$after"; then
              backmerged="$backmerged $domain@v$after"
            else
              preparation=true
            fi
          done
          if [[ "$preparation" == true ]]; then
            # A metadata-only preparation must not bypass application integration.
            # Registry packages share their domain's fixed version, so their
            # manifests and changelogs legitimately move in preparation pushes.
            while IFS= read -r file; do
              [[ "$file" =~ ^domains/(billing|payment|wingman)(/packages/[a-z-]+)?/(package.json|CHANGELOG.md)$ ]] || { printf 'Unexpected preparation file: %s\n' "$file"; exit 1; }
              if [[ "$file" == */package.json ]]; then
                diff <(git show "$BASE_SHA:$file" | jq -S 'del(.version)') <(jq -S 'del(.version)' "$file")
              fi
            done < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
          fi
          printf '## %s domain selection\n\n| Domain | Selected |\n| --- | --- |\n' "$FLOW" >> "$GITHUB_STEP_SUMMARY"
          for domain in billing payment wingman; do
            selected=false
            before=$(git show "$BASE_SHA:domains/$domain/package.json" | jq -r .version)
            after=$(jq -r .version "domains/$domain/package.json")
            if [[ "$FLOW" == release && "$before" != "$after" ]] && ! released_elsewhere "$domain" "$after"; then selected=true; fi
            if [[ "$FLOW" == dev && "$preparation" == false ]] && jq -e --arg domain "$domain" 'index($domain) != null' "$RUNNER_TEMP/affected.json" > /dev/null; then selected=true; fi
            printf '%s=%s\n' "$domain" "$selected" >> "$GITHUB_OUTPUT"
            printf '| %s | %s |\n' "$domain" "$selected" >> "$GITHUB_STEP_SUMMARY"
          done
          if [[ -n "$backmerged" ]]; then
            printf '\nAlready released from another ref, so not released again:%s. DEV still follows main.\n' "$backmerged" >> "$GITHUB_STEP_SUMMARY"
          fi
