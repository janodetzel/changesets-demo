name: Prepare semantic releases
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  deployments: read
concurrency:
  group: prepare-semantic-releases
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for registered source tags before preparing another version
        run: |
          # The release build registers each group's version tag shortly after
          # the preparation merge lands, so poll instead of failing the race.
          # Registry packages share their domain group's version and tag.
          for domain in billing payment wingman; do
            VERSION=$(jq -r .version "domains/$domain/package.json")
            TAG="$domain@v$VERSION"
            for attempt in $(seq 1 30); do
              if git rev-parse --verify --quiet "refs/tags/$TAG" > /dev/null \
                || git fetch origin "refs/tags/$TAG:refs/tags/$TAG" 2> /dev/null; then
                break
              fi
              if [[ "$attempt" -eq 30 ]]; then
                printf 'Version tag %s was not registered within 10 minutes. Check its release build.\n' "$TAG"
                exit 1
              fi
              sleep 20
            done
          done
      - name: Prepare versions and changelogs with native Nx Release
        run: pnpm release:prepare
      - name: Validate the prepared candidate
        run: pnpm build && pnpm test
      - name: Open or refresh the release preparation PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          branch: release/versions
          base: main
          title: 'chore(release): prepare domain releases'
          commit-message: 'chore(release): prepare domain versions and changelogs'
          body-path: release-preview.md
          add-paths: |
            domains/*/package.json
            domains/*/CHANGELOG.md
            domains/*/packages/*/package.json
            domains/*/packages/*/CHANGELOG.md
          delete-branch: true
